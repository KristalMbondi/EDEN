name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generer les dossiers de plateforme
        run: flutter create --org cm.tacoeden --project-name eden_mobility_passager --platforms android,ios,web .

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: dart run tool/prepare_platforms.dart
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: taco-eden-passager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
