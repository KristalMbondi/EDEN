name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generer les dossiers de plateforme
        run: flutter create --org cm.tacoeden --project-name eden_mobility_passager --platforms android,ios,web .

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: dart run tool/prepare_platforms.dart
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests (un echec ne bloque pas l'APK)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded > test_output.txt 2>&1
          code=$?
          cat test_output.txt
          if [ $code -ne 0 ]; then
            msg=$(grep -E -A 25 "\[E\]" test_output.txt | head -80 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Echec des tests::$msg"
          fi
          exit $code

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: taco-eden-passager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
